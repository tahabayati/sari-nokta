<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunucu · Sarı Nokta</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
html,body{background:#14213D;color:#FBF8F0;overflow:auto}
body{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:28px 36px;gap:18px;font-family:Inter,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;border-top:6px solid #FBF8F0;padding-top:12px;font:700 26px 'Space Grotesk',sans-serif}
#timer{font-size:62px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#timer.late{background:#FBF8F0;color:#14213D;padding:0 .2em}
#note{font-size:34px;line-height:1.32;overflow:auto;max-width:44em}
footer{display:flex;justify-content:space-between;gap:24px;align-items:center;font-size:22px;border-top:2px solid #E7E1D2;padding-top:12px}
button{font:600 22px Inter,sans-serif;background:#E7E1D2;color:#14213D;border:0;padding:8px 16px;margin-left:6px;cursor:pointer}
</style>
</head>
<body>
<header><span id="pos">Sunum penceresi bekleniyor</span><span id="timer">0:00</span></header>
<p id="note"></p>
<footer>
  <span>Sıradaki: <b id="next">–</b><br><span id="beat"></span></span>
  <span><button id="run" tabindex="-1">Başlat</button><button id="reset" tabindex="-1">Sıfırla</button></span>
</footer>
<script type="module">
import { NOTES } from './notes.js';
const $ = id => document.getElementById(id), ch = new BroadcastChannel('sari-nokta');
let acc = 0, since = null;
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const elapsed = () => acc + (since === null ? 0 : (performance.now() - since) / 1000);
function draw() {
  const s = elapsed(); $('timer').textContent = clock(s);
  $('run').textContent = since === null ? 'Başlat' : 'Durdur';
}
const acts = {
  run() { if (since === null) since = performance.now(); else { acc = elapsed(); since = null; } },
  reset() { acc = 0; since = null; },
};
for (const k in acts) $(k).onclick = () => { acts[k](); draw(); };
// Buttons never take focus, so arrow keys and space always reach the deck.
document.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'ArrowLeft', 'ArrowUp', 'PageUp', '1', '2'].includes(e.key)) { e.preventDefault(); ch.postMessage({ type: 'key', key: e.key }); }
});
ch.onmessage = ({ data: d }) => {
  if (d.type !== 'state') return;
  $('pos').textContent = `Slayt ${d.i + 1} / ${d.n}`;
  $('note').textContent = NOTES[d.i];
  $('next').textContent = d.next || '–';
  $('beat').textContent = d.i === 11 ? '1 Bugün · 2 Sarı Nokta' : d.beats > 1 ? `Bu slaytta ${d.b + 1}. adım / ${d.beats}` : '';
};
ch.postMessage({ type: 'hello' });
setInterval(draw, 250); draw();
</script>
</body>
</html>
